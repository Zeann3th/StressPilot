name: Build and Release Client Apps

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch backend jar asset
        shell: pwsh
        run: .github/scripts/fetch-backend.ps1

      - name: Align versions from pubspec.yaml
        run: python .github/scripts/patch-versions.py

      - name: Prepare Inno Setup DLLs and icon
        shell: pwsh
        run: |
          $tempDir = "$env:LOCALAPPDATA/Temp/StressPilotInstaller/Release"
          $installerIco = "$env:LOCALAPPDATA/Temp/StressPilotInstaller/installer.ico"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Copy-Item "C:\Windows\System32\msvcp140.dll" -Destination $tempDir -Force
          Copy-Item "C:\Windows\System32\vcruntime140.dll" -Destination $tempDir -Force
          Copy-Item "C:\Windows\System32\vcruntime140_1.dll" -Destination $tempDir -Force
          Copy-Item "windows/runner/resources/app_icon.ico" -Destination $installerIco -Force

      - name: Build Windows runner exe
        run: flutter build windows --release

      - name: Compile Windows Installer via Inno Setup
        run: iscc inno-script.iss

      - name: Upload Windows installer to Cloudflare R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern "^version:\s*([^\s+]+)").Matches.Groups[1].Value
          $filePath = "build/windows/x64/installer/Release/StressPilot-x86_64-$version-Installer.exe"
          $key = "StressPilot-x86_64-$version-Installer.exe"
          aws s3 cp $filePath "s3://stresspilot-releases/$key" --endpoint-url "https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"

  build-linux:
    name: Build Linux DEB Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch backend jar asset
        run: bash .github/scripts/fetch-backend.sh

      - name: Align versions from pubspec.yaml
        run: python .github/scripts/patch-versions.py

      - name: Build Linux app and package DEB
        run: make build-linux

      - name: Upload Linux DEB to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          FILE_PATH="dist/stress-pilot_${VERSION}_amd64.deb"
          KEY="stress-pilot_${VERSION}_amd64.deb"
          aws s3 cp "$FILE_PATH" "s3://stresspilot-releases/$KEY" --endpoint-url "https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"

  publish-release:
    name: Publish Release Configuration
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Register and publish update information to updater server
        env:
          UPDATER_ADMIN_TOKEN: ${{ secrets.UPDATER_ADMIN_TOKEN }}
        run: python .github/scripts/publish-release.py
